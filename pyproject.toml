[project]
name = "esci-retrieval"
version = "0.1.0"
description = "Two-stage neural retrieval over the Amazon ESCI dataset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "polars>=1.12",
    "pyarrow>=17",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",      # required by fastapi's TestClient
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, UP = modern syntax,
# B = likely bugs, SIM = simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esci"]