# One command to run the search service, sized like the load-tested setup:
#
#   docker compose -f docker/compose.yaml up --build
#
# Builds self-contained from the published serving artifacts (no dataset or
# GPU needed), then serves the demo page and API on http://localhost:8000.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ARTIFACT_REPO: N0va12007/esci-retrieval-artifacts
    image: esci-search
    ports:
      - "8000:8000"
    # 2 CPUs and 4 GB: the configuration benchmarks/latency_report.md measured.
    cpus: 2
    mem_limit: 4g
